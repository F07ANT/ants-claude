name: Build
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild r6_ext.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: r6_ext
          path: bin/Release/r6_ext.exe
